services:
  - type: web
    name: red-operativa-relacional
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn red_operativa_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SKYEYE_RELATIONAL_STANDALONE
        value: "1"
      - key: SKYEYE_DATA_DIR
        value: /var/data
    disk:
      name: skyeye-data
      mountPath: /var/data
      sizeGB: 5
